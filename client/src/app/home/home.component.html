<mat-card class="home-card">
  <mat-card-header>
    <mat-card-title>Home</mat-card-title>
    <mat-card-subtitle>Auth-ready starter shell</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    This project is ready for a new application surface. Auth, user management,
    routing, and the basic Angular shell are in place.
  </mat-card-content>
  <mat-card-actions>
    <a mat-raised-button color="primary" routerLink="/sign-up">
      <mat-icon>person_add</mat-icon>
      Sign Up
    </a>
    <a mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      Login
    </a>
  </mat-card-actions>
</mat-card>
